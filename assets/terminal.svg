<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Terminal session: whoami, stack, philosophy and current status">
  <title>shashwat@dev — terminal session</title>
  <desc>whoami: engineer who would rather ship it than describe it. interests: applied ML, LLMs and RAG, the systems around a model, domain problems. philosophy: build, break, instrument, learn, repeat. status: active, final year, shipping at Sentir, available immediately.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#060a10"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="428" rx="10" fill="url(#shell)" stroke="#1b2a3a" stroke-width="2"/>

  <!-- title bar -->
  <path d="M1 11a10 10 0 0 1 10-10h878a10 10 0 0 1 10 10v30H1z" fill="#0d151f"/>
  <line x1="1" y1="41" x2="899" y2="41" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="26" cy="21" r="5.5" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="5.5" fill="#febc2e"/>
  <circle cx="66" cy="21" r="5.5" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#4d6478">shashwat@dev — zsh — 120×32</text>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14.5">
    <!-- block 1 -->
    <text x="28" y="78"><tspan fill="#00e5a0">➜</tspan><tspan fill="#38bdf8" dx="10">~</tspan><tspan fill="#8fa8bd" dx="12">whoami</tspan></text>
    <text x="28" y="102" fill="#cfe3f2">engineer who would rather ship it than describe it</text>

    <!-- block 2 -->
    <text x="28" y="142"><tspan fill="#00e5a0">➜</tspan><tspan fill="#38bdf8" dx="10">~</tspan><tspan fill="#8fa8bd" dx="12">cat interests.txt</tspan></text>
    <text x="28" y="166" fill="#cfe3f2">applied ML · LLMs &amp; RAG · the systems around a model · domain problems</text>

    <!-- block 3 -->
    <text x="28" y="206"><tspan fill="#00e5a0">➜</tspan><tspan fill="#38bdf8" dx="10">~</tspan><tspan fill="#8fa8bd" dx="12">echo $PHILOSOPHY</tspan></text>
    <text x="28" y="230" fill="#cfe3f2">build <tspan fill="#3d5a72">→</tspan> break <tspan fill="#3d5a72">→</tspan> instrument <tspan fill="#3d5a72">→</tspan> learn <tspan fill="#3d5a72">→</tspan> repeat</text>

    <!-- block 4 -->
    <text x="28" y="270"><tspan fill="#00e5a0">➜</tspan><tspan fill="#38bdf8" dx="10">~</tspan><tspan fill="#8fa8bd" dx="12">systemctl status shashwat</tspan></text>
    <text x="28" y="294"><tspan fill="#28c840">●</tspan><tspan fill="#cfe3f2" dx="8">active (running)</tspan><tspan fill="#4d6478" dx="10">since 2023 · 27 public repos · uptime: caffeinated</tspan></text>
    <text x="28" y="318" fill="#8fa8bd">   Tasks: ML pipelines, API design, infra-as-code, papers at 2am</text>
    <text x="28" y="340" fill="#8fa8bd">   Status: final year · shipping @ Sentir · available immediately</text>

    <!-- live prompt -->
    <text x="28" y="378"><tspan fill="#00e5a0">➜</tspan><tspan fill="#38bdf8" dx="10">~</tspan></text>
    <rect x="70" y="365" width="9" height="17" fill="#00e5a0">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
