<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Shashwat Sharma — Applied AI and Systems Engineer">
  <title>Shashwat Sharma — Applied AI &amp; Systems Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="55%" stop-color="#080d16"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2a3d" stroke-width="1" opacity="0.45"/>
    </pattern>

    <radialGradient id="glow" cx="18%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="260" fill="none" stroke="#16222f" stroke-width="2"/>

  <!-- left accent rail -->
  <rect x="0" y="0" width="5" height="260" fill="url(#accent)"/>

  <!-- scanline -->
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#fade)" opacity="0.5">
    <animate attributeName="y" values="10;250;10" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- prompt line -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
    <text x="56" y="70" font-size="15" fill="#2f6f5e">shashwat@dev</text>
    <text x="178" y="70" font-size="15" fill="#2b4a63">:~$</text>
    <text x="214" y="70" font-size="15" fill="#6f8ba3">./build --relentless</text>

    <!-- name -->
    <text x="54" y="140" font-size="52" font-weight="700" letter-spacing="2" fill="#e9f6ff">SHASHWAT SHARMA</text>

    <!-- underline -->
    <rect x="56" y="156" width="430" height="2" fill="url(#accent)" opacity="0.85"/>

    <!-- role -->
    <text x="56" y="192" font-size="17" fill="#00e5a0">Applied AI</text>
    <text x="164" y="192" font-size="17" fill="#395268">/</text>
    <text x="178" y="192" font-size="17" fill="#38bdf8">LLM Systems</text>
    <text x="296" y="192" font-size="17" fill="#395268">/</text>
    <text x="310" y="192" font-size="17" fill="#a78bfa">Forward-Deployed Engineer</text>

    <!-- tagline -->
    <text x="56" y="224" font-size="14" fill="#5f7b93">Build systems. Break limits. Ship anyway.<tspan fill="#00e5a0" dx="8">&#9608;<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- right: signal / architecture glyph -->
  <g opacity="0.95">
    <!-- nodes -->
    <g fill="#081520" stroke="#1f3b4d" stroke-width="1.5">
      <rect x="900" y="56" width="92" height="30" rx="5"/>
      <rect x="1040" y="56" width="92" height="30" rx="5"/>
      <rect x="900" y="118" width="92" height="30" rx="5"/>
      <rect x="1040" y="118" width="92" height="30" rx="5"/>
      <rect x="970" y="180" width="92" height="30" rx="5"/>
    </g>
    <g font-family="'SFMono-Regular',Consolas,monospace" font-size="10.5" fill="#5f8299" text-anchor="middle">
      <text x="946" y="75">data</text>
      <text x="1086" y="75">model</text>
      <text x="946" y="137">api</text>
      <text x="1086" y="137">infra</text>
      <text x="1016" y="199">shipped</text>
    </g>
    <!-- edges -->
    <g stroke="#1f3b4d" stroke-width="1.5" fill="none">
      <path d="M992 71h48"/>
      <path d="M992 133h48"/>
      <path d="M946 86v32"/>
      <path d="M1086 86v32"/>
      <path d="M946 148v18h70"/>
      <path d="M1086 148v18h-70"/>
    </g>
    <!-- travelling packet -->
    <circle r="3.5" fill="#00e5a0">
      <animateMotion dur="4.5s" repeatCount="indefinite"
        path="M946 56 L946 86 L946 118 L946 148 L946 166 L1016 166 L1016 180"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#38bdf8">
      <animateMotion dur="4.5s" begin="1.6s" repeatCount="indefinite"
        path="M992 71 L1040 71 L1086 86 L1086 118 L1086 166 L1016 166 L1016 180"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- corner ticks -->
  <g stroke="#00e5a0" stroke-width="2" opacity="0.7" fill="none">
    <path d="M1180 14h-22"/><path d="M1186 20v22"/>
    <path d="M1180 246h-22"/><path d="M1186 240v-22"/>
  </g>
</svg>
